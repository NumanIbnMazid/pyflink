version: "2.2"
services:
  jobmanager:
    image: pyflink-ocr:1.14.4
    ports:
      - "8081:8081"
    command: standalone-job -py /opt/flink/usrlib/fifa/main.py
    volumes:
      - ./:/opt/flink/usrlib
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2        

  taskmanager:
    image: pyflink-ocr:1.14.4
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    volumes:
      - ./:/opt/flink/usrlib
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
